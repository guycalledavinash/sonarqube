# SonarQube scanner configuration for:
# https://github.com/guycalledavinash/miscellaneous/tree/main/test-8-apr-25
#
# Run scan.sh from this repository, or pass this file as project.settings while
# running sonar-scanner from the root of the application being analyzed.

sonar.projectKey=guycalledavinash_miscellaneous_test-8-apr-25
sonar.projectName=miscellaneous-test-8-apr-25
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Analyze the full checkout. Test files are classified by the inclusion patterns
# below, so they are not also declared as a second, overlapping source scope.
sonar.sources=.

# Classify common test locations and file names as test code. Replace these broad
# patterns with the application's exact test directories when they are known.
sonar.test.inclusions=**/test/**,**/tests/**,**/__tests__/**,**/*test*/**,**/*.test.*,**/*.spec.*,**/*Test.*,**/*Tests.*

# Exclude generated, dependency, build, cache, binary, and report artifacts from main-code analysis.
sonar.exclusions=**/.git/**,**/.scannerwork/**,**/node_modules/**,**/bower_components/**,**/vendor/**,**/dist/**,**/build/**,**/coverage/**,**/.next/**,**/out/**,**/target/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/*.min.js,**/*.map,**/*.log,**/*.lock,**/*.zip,**/*.jar,**/*.war,**/*.class

# Keep coverage focused on application code, not tests, mocks, generated files, or framework/config files.
sonar.coverage.exclusions=**/test/**,**/tests/**,**/__tests__/**,**/*test*/**,**/*.test.*,**/*.spec.*,**/*Test.*,**/*Tests.*,**/mocks/**,**/__mocks__/**,**/generated/**,**/*.config.*,**/webpack.*.js,**/vite.config.*,**/jest.config.*,**/next.config.*

# Avoid duplication noise from dependency locks and generated/build outputs.
sonar.cpd.exclusions=**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml,**/poetry.lock,**/Pipfile.lock,**/generated/**,**/dist/**,**/build/**,**/coverage/**

# Coverage report paths: uncomment the reports produced by the project before scanning.
# JavaScript/TypeScript (Jest, Vitest, nyc)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python (coverage.py)
# sonar.python.coverage.reportPaths=coverage.xml

# Java/Kotlin/JVM (JaCoCo XML)
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,build/reports/jacoco/test/jacocoTestReport.xml

# Generic test execution reports, if generated by CI.
# sonar.junit.reportPaths=target/surefire-reports,build/test-results/test
# sonar.testExecutionReportPaths=reports/sonar/test-execution.xml
